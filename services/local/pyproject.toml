[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-companion-service"
version = "0.1.0"
description = "Local companion service (loopback-only) for translation, document parsing/export, OCR, ASR and long-running jobs"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "python-docx>=1.1",
  "PyMuPDF>=1.24",
]

# 可选本地推理依赖：按需安装，未安装时能力自检会如实报告不可用。
[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
ocr = ["pytesseract>=0.3.10"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = ["local_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"
